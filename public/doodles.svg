<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!--
    Pattern di sfondo della conversazione: doodle originali a tema sviluppo,
    equivalente funzionale dello sfondo di WhatsApp senza usarne l'asset.
    Le icone sono distribuite in modo irregolare per non far leggere la griglia.
  -->
  <g fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- graffe -->
    <g transform="translate(28 34) rotate(-12)">
      <path d="M10 0C4 0 4 6 4 10s0 8-4 8c4 0 4 4 4 8s0 10 6 10" />
      <path d="M34 0c6 0 6 6 6 10s0 8 4 8c-4 0-4 4-4 8s0 10-6 10" />
    </g>

    <!-- terminale -->
    <g transform="translate(150 26) rotate(8)">
      <rect x="0" y="0" width="52" height="38" rx="5" />
      <path d="M9 12l8 7-8 7M23 26h18" />
    </g>

    <!-- ramo git -->
    <g transform="translate(288 40) rotate(-6)">
      <circle cx="8" cy="8" r="6" />
      <circle cx="8" cy="46" r="6" />
      <circle cx="42" cy="20" r="6" />
      <path d="M8 14v26M8 30c0-8 10-10 18-10h10" />
    </g>

    <!-- tag angolari -->
    <g transform="translate(368 122) rotate(14)">
      <path d="M12 0L0 12l12 12M26 0l12 12-12 12" />
    </g>

    <!-- database -->
    <g transform="translate(44 130) rotate(6)">
      <ellipse cx="20" cy="8" rx="20" ry="8" />
      <path d="M0 8v28c0 4.4 9 8 20 8s20-3.6 20-8V8" />
      <path d="M0 22c0 4.4 9 8 20 8s20-3.6 20-8" />
    </g>

    <!-- tazza di caffè -->
    <g transform="translate(206 132) rotate(-10)">
      <path d="M0 8h34v20a10 10 0 01-10 10H10A10 10 0 010 28z" />
      <path d="M34 14h6a7 7 0 010 14h-6" />
      <path d="M8 0c0 4 4 4 4 0M18 0c0 4 4 4 4 0" />
    </g>

    <!-- bug -->
    <g transform="translate(322 168) rotate(10)">
      <rect x="8" y="8" width="26" height="30" rx="13" />
      <path d="M8 16L0 10M8 24H0M8 32l-8 6M34 16l8-6M34 24h8M34 32l8 6" />
      <path d="M14 8a7 7 0 0114 0" />
    </g>

    <!-- parentesi tonde e punto e virgola -->
    <g transform="translate(120 200) rotate(-4)">
      <path d="M14 0C4 8 4 30 14 38M40 0c10 8 10 30 0 38" />
      <circle cx="27" cy="14" r="1.6" fill="#000" stroke="none" />
      <path d="M27 24c0 2-2 3-2 5" />
    </g>

    <!-- razzo -->
    <g transform="translate(20 250) rotate(-18)">
      <path d="M18 0c8 8 12 18 12 28l-12 8-12-8C6 18 10 8 18 0z" />
      <circle cx="18" cy="16" r="5" />
      <path d="M6 24L0 34l8-2M30 24l6 10-8-2M14 40c2 6 6 8 4 12 4-2 8-6 8-12" />
    </g>

    <!-- nuvola -->
    <g transform="translate(250 246) rotate(6)">
      <path d="M12 32a12 12 0 010-24 16 16 0 0130-4 11 11 0 012 28z" />
    </g>

    <!-- chiave inglese -->
    <g transform="translate(360 268) rotate(-22)">
      <path d="M30 0a12 12 0 00-14 16L0 32l6 6 16-16A12 12 0 0038 8z" />
    </g>

    <!-- cuore -->
    <g transform="translate(160 292) rotate(12)">
      <path d="M18 34C8 26 0 20 0 12A10 10 0 0118 6 10 10 0 0136 12c0 8-8 14-18 22z" />
    </g>

    <!-- dado a venti facce -->
    <g transform="translate(70 340) rotate(-8)">
      <path d="M20 0l20 12v22L20 46 0 34V12z" />
      <path d="M20 0v14M0 12l20 2M40 12l-20 2M20 14l-12 20M20 14l12 20M8 34h24" />
    </g>

    <!-- freccia di deploy -->
    <g transform="translate(300 350) rotate(4)">
      <path d="M14 34V6M4 16L14 6l10 10" />
      <path d="M0 40h28" />
    </g>

    <!-- pin di posizione -->
    <g transform="translate(210 366) rotate(-6)">
      <path d="M13 34S0 21 0 13a13 13 0 0126 0c0 8-13 21-13 21z" />
      <circle cx="13" cy="13" r="5" />
    </g>

    <!-- stella -->
    <g transform="translate(388 22) rotate(10)">
      <path d="M12 0l4 8 8 1-6 6 2 9-8-4-8 4 2-9-6-6 8-1z" />
    </g>
  </g>
</svg>
